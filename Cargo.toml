[workspace]
members = [
  "student_core",
  "sam",
  "sam_adapter",
  "app_bootstrap",
  "gui_application",
  "authentication",
]
resolver = "3"

[workspace.dependencies]
async-trait = "0.1.89"
anyhow = "1.0.103"
thiserror = "2.0.18"
chrono = "0.4.45"
pretty_assertions = "1.4.1"
smol = "2.0.2"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 } # UM, ACTUALLY
nursery = { level = "deny", priority = -1 }  # BETA LINTS
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
