[workspace]
members = [
  "student",
  "sam",
  "gui_application",
  "authentication",
  "credential_store",
]
resolver = "3"

[workspace.dependencies]
authentication = { path = "authentication" }
credential_store = { path = "credential_store" }
student = { path = "student" }
sam = { path = "sam" }
anyhow = "1.0.103"
thiserror = "2.0.18"
chrono = "0.4.45"
pretty_assertions = "1.4.1"
smol = "2.0.2"
reqwest = { version = "0.13.4", features = [
  "blocking",
  "form",
  "cookies",
  "json",
] }
cocoon = { version = "0.5.0", default-features = false }
dirs = "7.0.0"
flutter_rust_bridge = "=2.14.0-beta.2"
getrandom = "0.4.3"
scraper = "0.27.0"
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3"
wiremock = "0.6.5"
zeroize = "1"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 } # UM, ACTUALLY
nursery = { level = "deny", priority = -1 }  # BETA LINTS
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
missing_errors_doc = "allow"
