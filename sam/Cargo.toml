[package]
name = "sam"
version = "0.1.0"
edition = "2024"

[features]
test-support = []

[dependencies]
anyhow = { workspace = true }
reqwest = { version = "0.13.4", features = [
  "blocking",
  "form",
  "cookies",
  "json",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
scraper = "0.27.0"
thiserror.workspace = true

[dev-dependencies]
sam = { path = ".", features = ["test-support"] }
smol = { workspace = true }
wiremock = "0.6.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("test-support"))',
] }
