[package]
name = "credential_store"
version = "0.1.0"
edition = "2024"

[dependencies]
authentication = { path = "../authentication" }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
cocoon = { version = "0.4", default-features = false, features = ["std"] }
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
smol = { workspace = true }
tempfile = "3"

[lints]
workspace = true
